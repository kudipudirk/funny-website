<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Naa Life Story 📖</title>
<meta name="description" content="Naa life story. Ikkada emi ledu.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffd93b;--ink:#1c1300;--red:#e63946;--white:#fffdf2;--head:"Bangers",Impact,sans-serif;--body:"Baloo 2",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#2a1f00;--ink:#fff3c4;--red:#ff6b76;--white:#3a2c00}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:500 1.1rem/1.4 var(--body);text-align:center;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:4px solid var(--red);outline-offset:3px}
main{min-height:100%;display:flex;align-items:center;justify-content:center;padding:1rem 1.25rem calc(1rem + env(safe-area-inset-bottom,0px))}
.screen{display:none;width:100%;max-width:34rem;flex-direction:column;align-items:center;gap:.8rem}
.screen.on{display:flex}
h1{font:400 clamp(2.2rem,9vw,3.8rem)/1 var(--head);letter-spacing:.02em;margin:0}
h1 em{font-style:normal;color:var(--red)}
p{margin:0}
.bar{width:100%;height:1.6rem;border:4px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--white)}
.bar i{display:block;height:100%;width:0;background:var(--red)}
.monkey{width:min(13rem,36vh,64vw);aspect-ratio:1;display:grid;place-items:center;border-radius:50%;background:var(--white);border:5px solid var(--ink);font-size:clamp(4rem,18vh,6.5rem);position:relative;overflow:hidden}
.monkey img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bubble{background:var(--white);border:4px solid var(--ink);border-radius:1rem;padding:.4rem 1rem;font-weight:700;width:100%;min-height:2.9rem;display:flex;align-items:center;justify-content:center}
.count{font-size:.95rem;opacity:.85}
.pill,.btn{font:700 1.05rem var(--body);padding:.6rem 1.3rem;border:4px solid var(--ink);border-radius:999px;background:var(--white);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block;box-shadow:4px 4px 0 var(--ink)}
.pill:active,.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.go{background:var(--red);color:#fff}
.row{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center}
.fall{position:fixed;top:-2rem;font-size:2rem;pointer-events:none;animation:fall 3s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:no-preference){
  .monkey span,.monkey img{animation:wobble 1.2s ease-in-out infinite}
  @keyframes wobble{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
  #s2.on h1{animation:pop .5s}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<main>

  <!-- SCREEN 1: looks like the real story is opening -->
  <section class="screen on" id="s1">
    <h1>Naa life story 📖</h1>
    <div class="bar" role="progressbar" aria-label="Loading"><i id="fill"></i></div>
    <p id="msg">Story open avuthundi…</p>
  </section>

  <!-- SCREEN 2: there is no story. You got fooled. -->
  <section class="screen" id="s2">
    <h1>Ikkada <em>emi ledu</em>…<br>mala fool ayavu! 😂</h1>
    <div class="monkey" aria-label="Laughing monkey">
      <span>🙈</span>
      <!-- Funny photo or logo: save it as monkey.jpg in the same folder. If missing, the emoji stays. -->
      <img src="monkey.jpg" alt="" onerror="this.remove()">
    </div>
    <div class="bubble" id="say" aria-live="polite">Story anta emi ledu. Ippudu musukoni, pani chusuko ra baabu 🤭</div>
    <p class="count" id="count">Nuvvu fool ayina count: 2</p>
    <div class="row">
      <button class="pill go" id="more" type="button">Inka story kavali 😭</button>
      <a class="pill" href="index.html">Malli monkey ni pattukuntanu 🐒</a>
    </div>
  </section>

</main>

<script>
const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random() * a.length)];
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

function rain(list, n){
  if (calm) return;
  for (let i = 0; i < n; i++) {
    const b = document.createElement('div');
    b.className = 'fall'; b.textContent = pick(list);
    b.style.left = Math.random() * 95 + 'vw'; b.style.animationDelay = Math.random() * 1.2 + 's';
    document.body.appendChild(b); setTimeout(() => b.remove(), 4500);
  }
}

/* Screen 1: bar fills to 100%, so it looks like the real story is coming */
const msgs = ['Story open avuthundi…','Chapter 1 ready chestunnam…','Memories load ayyayi ✅','Ippude chupistha…'];
let p = 0;
const timer = setInterval(() => {
  p += 5;
  $('fill').style.width = Math.min(p, 100) + '%';
  $('msg').textContent = msgs[Math.min(3, Math.floor(p / 26))];
  if (p >= 100) {
    clearInterval(timer);
    setTimeout(() => { document.getElementById('s1').classList.remove('on'); $('s2').classList.add('on'); rain(['🍌','🐒','😂','🙈'], 26); }, 600);
  }
}, 80);

/* Screen 2: every tap = fooled again */
const fools = [
  'Cheppanu kada, emi ledu! 😂',
  'Nee patience ki salute 🫡',
  'Inka emi kavali? Banana aa? 🍌',
  'Nuvvu inka nammutunnava? Wow 🤣',
  'Story emi ledu, kani monkey undi 🐒',
  'Tap chesthe monkey nee phone lo dachukuntundi 😏',
  'Sare, ippudu nijam: ikkada emi ledu. Bye 👋'
];
let n = 2, k = 0;
$('more').addEventListener('click', () => {
  n++; $('count').textContent = 'Nuvvu fool ayina count: ' + n;
  $('say').textContent = fools[k % fools.length]; k++;
  rain(['😂','🍌'], 6);
});
</script>
</body>
</html>
